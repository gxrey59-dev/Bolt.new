name: Check application
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.6
      - run: deno check --node-modules-dir=none supabase/functions/binance-feed/index.ts supabase/functions/binance-account/index.ts supabase/functions/stripe-checkout/index.ts supabase/functions/stripe-subscription-checkout/index.ts supabase/functions/stripe-webhook/index.ts
